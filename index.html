<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Talking Photo</title>

<script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="bg-gray-900 text-white min-h-screen flex items-center justify-center p-5">

<div class="max-w-md w-full bg-gray-800 p-8 rounded-2xl shadow-2xl">

<h1 class="text-2xl font-bold text-center text-blue-400 mb-6">
📸 AI Talking Photo
</h1>

<input type="file" id="imageInput" accept="image/*"
class="w-full mb-4">

<input type="file" id="audioInput" accept="audio/mp3,audio/mpeg"
class="w-full mb-4">

<input type="text" id="imageUrl" readonly
placeholder="Image URL"
class="w-full p-3 rounded bg-gray-900 mb-4">

<input type="text" id="audioUrl" readonly
placeholder="Audio URL"
class="w-full p-3 rounded bg-gray-900 mb-4">

<button
onclick="generateVideo()"
id="generateBtn"
class="w-full bg-blue-600 hover:bg-blue-700 py-3 rounded-lg font-bold">

Generate Video

</button>

<div id="status"
class="mt-4 text-center text-sm text-gray-300">
</div>

<video
id="videoPlayer"
controls
class="w-full mt-5 rounded-lg hidden">
</video>

</div>

<script src="script.js"></script>

</body>
</html>
